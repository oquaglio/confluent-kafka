# 2-broker Kafka cluster (KRaft, no ZooKeeper) + Kafka UI.
#
#   controller  - KRaft controller only (cluster metadata), stores no topic data
#   kafka-1     - broker, node 1, host port 9092
#   kafka-2     - broker, node 2, host port 9094
#   init-topics - one-shot: creates topic `orders` (4 partitions, replicated on both brokers)
#   kafka-ui    - http://localhost:8082

# Pinned: in cp-kafka 8.4.x (:latest as of Nov 2026) a controller-only node can't start. Kafka requires
# advertised.listeners, but the image's startup script refuses KAFKA_ADVERTISED_LISTENERS on a controller.
x-kafka-image: &kafka-image confluentinc/cp-kafka:8.1.0

x-kafka-common: &kafka-common
  image: *kafka-image
  environment: &kafka-common-env
    CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk  # same on every node; replace with `kafka-storage random-uuid`
    KAFKA_CONTROLLER_QUORUM_VOTERS: 100@controller:29093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LOG_DIRS: /var/lib/kafka/data

x-broker-env: &broker-env
  <<: *kafka-common-env
  KAFKA_PROCESS_ROLES: broker
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  # Internal topics replicated on both brokers
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  # Defaults for new topics
  KAFKA_DEFAULT_REPLICATION_FACTOR: 2
  KAFKA_NUM_PARTITIONS: 4
  KAFKA_MIN_INSYNC_REPLICAS: 1  # with 2 replicas, 1 lets acks=all writes continue while a broker is down
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # Confluent metrics reporter topic defaults to RF 3; keep it within 2 brokers
  KAFKA_CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 2

services:
  controller:
    <<: *kafka-common
    container_name: kafka-controller
    environment:
      <<: *kafka-common-env
      KAFKA_PROCESS_ROLES: controller
      KAFKA_NODE_ID: 100
      KAFKA_LISTENERS: CONTROLLER://controller:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
    volumes:
      - controller-data:/var/lib/kafka/data

  kafka-1:
    <<: *kafka-common
    container_name: kafka-broker-1
    depends_on: [controller]
    ports:
      - "9092:9092"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    container_name: kafka-broker-2
    depends_on: [controller]
    ports:
      - "9094:9094"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9094
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  # One-shot job: waits until both brokers are registered, then creates the demo topic.
  init-topics:
    image: *kafka-image
    container_name: kafka-init-topics
    depends_on: [kafka-1, kafka-2]
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        B=kafka-1:29092,kafka-2:29092
        echo "Waiting for 2 brokers..."
        until [ "$$(kafka-broker-api-versions --bootstrap-server $$B 2>/dev/null | grep -c '^kafka-')" -ge 2 ]; do sleep 2; done
        kafka-topics --bootstrap-server $$B --create --if-not-exists \
          --topic orders --partitions 4 --replication-factor 2
        kafka-topics --bootstrap-server $$B --describe --topic orders

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on: [kafka-1, kafka-2]
    ports:
      - "8082:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: cluster
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092

volumes:
  controller-data:
  kafka-1-data:
  kafka-2-data:
