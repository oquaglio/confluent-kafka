# Kafka -> Kafka Connect (JDBC sink) -> PostgreSQL.
#
#   kafka           - single KRaft broker (broker + controller), host port 9092
#   schema-registry - Avro schemas, http://localhost:8081
#   connect         - Kafka Connect worker with JDBC + Datagen plugins, REST API http://localhost:8083
#   connect-init    - one-shot: registers the connectors in ./connectors (datagen-orders, postgres-sink)
#   postgres        - target database `demo` (user/password demo/demo), host port 5432
#   kafka-ui        - http://localhost:8082
#   pgadmin         - Postgres web UI, http://localhost:5050 (no login, `demo` server pre-registered)
#
# Data flow:  datagen-orders (source) -> topic `orders` (Avro) -> postgres-sink -> table `orders`

x-kafka-image: &kafka-image confluentinc/cp-kafka:8.1.0
x-connect-image: &connect-image confluent-kafka-db-consumer/connect:8.1.0

services:
  kafka:
    image: *kafka-image
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk  # replace with `kafka-storage random-uuid`
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.0
    container_name: schema-registry
    depends_on:
      kafka: { condition: service_healthy }
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 5s
      retries: 30

  connect:
    build:
      context: .
      dockerfile: connect/Dockerfile
    image: *connect-image
    container_name: kafka-connect
    depends_on:
      kafka: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      postgres: { condition: service_healthy }
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: connect-cluster
      # Internal topics where Connect stores connector configs, source offsets and status
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Keys are plain strings, values are Avro (schema stored in Schema Registry).
      # The JDBC sink needs a schema to build the table, which Avro provides.
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_LOG4J_LOGGERS: org.reflections=ERROR
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  # One-shot job: creates/updates the connectors baked into the image from ./connectors.
  connect-init:
    image: *connect-image
    container_name: kafka-connect-init
    depends_on:
      connect: { condition: service_healthy }
    restart: "no"
    environment:
      CONNECT_URL: http://connect:8083
    entrypoint: ["/usr/local/bin/register-connectors.sh"]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka: { condition: service_healthy }
    ports:
      - "8082:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083

  # Postgres web UI. Desktop mode = no pgAdmin login; the `demo` server and its password come from the
  # inline configs below (not bind mounts, so it works when Docker runs in another WSL2 distro).
  pgadmin:
    image: dpage/pgadmin4:9.10
    container_name: pgadmin
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com      # required by the image, unused in desktop mode
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
      - source: pgadmin-pgpass
        target: /pgadmin4/pgpass
        uid: "5050"      # pgAdmin runs as uid 5050; libpq ignores a pgpass it can't read or that isn't 0600
        gid: "0"
        mode: 0600
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  kafka-data:
  postgres-data:
  pgadmin-data:

configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "demo",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "demo",
            "Username": "demo",
            "PassFile": "/pgadmin4/pgpass",
            "SSLMode": "prefer"
          }
        }
      }
  pgadmin-pgpass:
    content: |
      postgres:5432:*:demo:demo
