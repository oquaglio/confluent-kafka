# Teaching project for `docker compose watch`. Only `gateway` publishes a port.
#
#   seed     - one-shot (init): writes stack-info.json into the `shared` volume, exits 0
#   site     - nginx static files        watch: sync (+ ignore, initial_sync)
#   notes    - busybox httpd, generated  watch: sync+exec (+ include)
#   api      - Python (uv) JSON API      watch: rebuild (deps), sync+restart (app.py)
#   gateway  - nginx reverse proxy       watch: sync+restart (nginx.conf)
#
# Ordering: seed completes -> site, api start -> all healthy -> gateway starts.
#
#   docker compose up --build --watch   # start + watch in one foreground process
#   docker compose watch                # same, but Ctrl-C leaves the containers running

x-healthcheck: &healthcheck
  interval: 3s
  timeout: 3s
  retries: 20
  start_period: 2s

services:
  seed:
    build: ./init
    container_name: watch-seed
    volumes:
      - shared:/shared
    restart: "no"

  site:
    build: ./site
    container_name: watch-site
    depends_on:
      seed: { condition: service_completed_successfully }
    volumes:
      - shared:/usr/share/nginx/html/meta:ro   # seeded data, not watched
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
    develop:
      watch:
        # Hot reload: files are copied into the running container, nothing restarts.
        - path: ./site/html
          target: /usr/share/nginx/html
          action: sync
          initial_sync: true              # push host edits made while watch was off
          ignore:                         # relative to `path`
            - drafts/
            - "*.tmp"
            - "*.swp"

  notes:
    build: ./notes
    container_name: watch-notes
    init: true        # busybox httpd as PID 1 ignores SIGTERM; tini forwards it
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
    develop:
      watch:
        # Copy the changed sources in, then run a command inside the container.
        - path: ./notes/content
          target: /src
          action: sync+exec
          include:                        # only these files trigger the rule
            - "*.txt"
          exec:
            command: build-notes

  api:
    build: ./api
    container_name: watch-api
    init: true        # tini as PID 1: python gets SIGTERM, so restarts take ~1s instead of 10s
    depends_on:
      seed: { condition: service_completed_successfully }
    volumes:
      - shared:/shared:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
    develop:
      watch:
        # Dependencies are baked into the image: rebuild it and recreate the container.
        - path: ./api/pyproject.toml
          action: rebuild
        - path: ./api/uv.lock
          action: rebuild
        # Code: copy the file in and restart the process (no image build).
        - path: ./api/app.py
          target: /app/app.py
          action: sync+restart

  gateway:
    build: ./gateway
    container_name: watch-gateway
    depends_on:
      site: { condition: service_healthy }
      notes: { condition: service_healthy }
      api: { condition: service_healthy }
    ports:
      - "${GATEWAY_PORT:-8090}:80"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
    develop:
      watch:
        # nginx only reads config at startup: copy the file in, then restart the container.
        - path: ./gateway/nginx.conf
          target: /etc/nginx/conf.d/default.conf
          action: sync+restart

volumes:
  shared:
