# Edit BANNER below while watch is running: compose syncs this file and restarts the container.
# Docker's embedded DNS + variables in proxy_pass make nginx re-resolve upstreams, so it keeps
# working when `api` is rebuilt and comes back with a new IP.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    add_header X-Demo-Banner "v1" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
    }

    location /notes/ {
        set $notes http://notes:8080;
        rewrite ^/notes/(.*)$ /$1 break;
        proxy_pass $notes;
    }

    location / {
        set $site http://site:80;
        proxy_pass $site;
    }
}
