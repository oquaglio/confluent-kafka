services:
  kafka:
    image: confluentinc/cp-kafka:8.4.1
    hostname: kafka
    container_name: kafka-broker
    ports:
      - "9092:9092"  # External access for clients
    environment:
      # Basic broker settings
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1  # Single broker, so 1 replica
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # KRaft mode settings (no ZooKeeper)
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Generate a unique cluster ID (run `kafka-storage random-uuid` in container if needed)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk  # Static example; replace with your own
    volumes:
      # Named volume: Docker manages ownership, so the non-root appuser (uid 1000) can write.
      - kafka-data:/var/lib/kafka/data
    # Healthy once the broker answers API requests; Kafka UI waits for this
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # Web console for topics, messages and consumer groups.
  # kafbat/kafka-ui is the maintained fork of provectuslabs/kafka-ui. No login: published on localhost only.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.1
    hostname: kafka-ui
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:29092

volumes:
  kafka-data:
