# Avro end to end: schema file -> Schema Registry -> Datagen (Avro source) -> Kafka -> JDBC sink -> PostgreSQL.
#
#   kafka           - single KRaft broker (broker + controller), host port 9092
#   schema-registry - stores the Avro schema for subject `transactions-value`, http://localhost:8081
#   postgres        - target database `demo` (user/password demo/demo), host port 5432
#   connect         - Kafka Connect worker with Datagen + JDBC plugins, REST API http://localhost:8083
#   init            - one-shot: registers schemas/*.avsc, then connectors/*.json, then exits
#   kafka-ui        - http://localhost:8082 (topics, decoded Avro messages, schemas, connectors)
#
# Data flow:  datagen-transactions -> topic `transactions` (Avro) -> postgres-sink -> table `transactions`
#
# `docker compose up -d --build` runs everything once.
# `docker compose watch` additionally re-runs `init` whenever you edit schemas/ or connectors/.

x-kafka-image: &kafka-image confluentinc/cp-kafka:8.1.0

services:
  kafka:
    image: *kafka-image
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: QXZyb0RlbW9DbHVzdGVyMQ  # any base64 UUID; `kafka-storage random-uuid` makes one
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Schemas live in the compacted topic `_schemas` in Kafka, so they survive restarts via kafka-data.
  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.0
    container_name: schema-registry
    depends_on:
      kafka: { condition: service_healthy }
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD   # global default; init also pins it per subject
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 5s
      retries: 30

  connect:
    build:
      context: .
      dockerfile: connect/Dockerfile
    image: confluent-kafka-avro/connect:8.1.0
    container_name: kafka-connect
    depends_on:
      kafka: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      postgres: { condition: service_healthy }
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Worker defaults: string keys, Avro values (schema id in each message, schema in the registry).
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_LOG4J_LOGGERS: org.reflections=ERROR
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  init:
    build:
      context: .
      dockerfile: init/Dockerfile
    image: confluent-kafka-avro/init:latest
    container_name: avro-init
    depends_on:
      schema-registry: { condition: service_healthy }
      connect: { condition: service_healthy }
    restart: "no"
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_URL: http://connect:8083
    develop:
      watch:
        - path: ./schemas
          action: rebuild
        - path: ./connectors
          action: rebuild

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      kafka: { condition: service_healthy }
    ports:
      - "8082:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083

volumes:
  kafka-data:
  postgres-data:
