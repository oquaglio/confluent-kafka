---
# Kafka side: based on Confluent's cp-all-in-one 8.4.1 (https://github.com/confluentinc/cp-all-in-one),
# without Control Center, Prometheus and Alertmanager. Flink side: official Flink 2.2.1 image + connectors.

# One image for every Flink container (flink/Dockerfile): Kafka + JDBC connectors, SQL files, submit script
x-flink-build: &flink-build
  context: .
  dockerfile: flink/Dockerfile

# Shared Flink config, appended to conf/config.yaml by the image's entrypoint
x-flink-env: &flink-env
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: flink-jobmanager
    rest.address: flink-jobmanager
    rest.port: 9081
    taskmanager.numberOfTaskSlots: 10

services:

  broker:
    image: confluentinc/cp-server:8.4.1
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CONFLUENT_SUPPORT_CUSTOMER_ID: 'anonymous'
      # Replace CLUSTER_ID with a unique base64 UUID using "bin/kafka-storage.sh random-uuid"
      # See https://docs.confluent.io/kafka/operations-tools/kafka-tools.html#kafka-storage-sh
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.1
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - broker
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  connect:
    image: cnfldemos/cp-server-connect-datagen:0.6.7-8.0.0
    hostname: connect
    container_name: connect
    depends_on:
      - broker
      - schema-registry
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'broker:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"

  ksqldb-server:
    image: confluentinc/cp-ksqldb-server:8.4.1
    hostname: ksqldb-server
    container_name: ksqldb-server
    depends_on:
      - broker
      - connect
    ports:
      - "8088:8088"
    environment:
      KSQL_CONFIG_DIR: "/etc/ksql"
      KSQL_BOOTSTRAP_SERVERS: "broker:29092"
      KSQL_HOST_NAME: ksqldb-server
      KSQL_LISTENERS: "http://0.0.0.0:8088"
      KSQL_CACHE_MAX_BYTES_BUFFERING: 0
      KSQL_KSQL_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      KSQL_KSQL_CONNECT_URL: "http://connect:8083"
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR: 1
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: 'true'
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: 'true'

  # cp-ksqldb-cli and ksqldb-examples are only published up to 8.0.x
  ksqldb-cli:
    image: confluentinc/cp-ksqldb-cli:8.0.9
    container_name: ksqldb-cli
    depends_on:
      - broker
      - connect
      - ksqldb-server
    entrypoint: /bin/sh
    tty: true

  ksql-datagen:
    image: confluentinc/ksqldb-examples:8.0.9
    hostname: ksql-datagen
    container_name: ksql-datagen
    depends_on:
      - ksqldb-server
      - broker
      - schema-registry
      - connect
    command: "bash -c 'echo Waiting for Kafka to be ready... && \
                       cub kafka-ready -b broker:29092 1 40 && \
                       echo Waiting for Confluent Schema Registry to be ready... && \
                       cub sr-ready schema-registry 8081 40 && \
                       echo Waiting a few seconds for topic creation to finish... && \
                       sleep 11 && \
                       tail -f /dev/null'"
    environment:
      KSQL_CONFIG_DIR: "/etc/ksql"
      STREAMS_BOOTSTRAP_SERVERS: broker:29092
      STREAMS_SCHEMA_REGISTRY_HOST: schema-registry
      STREAMS_SCHEMA_REGISTRY_PORT: 8081

  rest-proxy:
    image: confluentinc/cp-kafka-rest:8.4.1
    depends_on:
      - broker
      - schema-registry
    ports:
      - 8082:8082
    hostname: rest-proxy
    container_name: rest-proxy
    environment:
      KAFKA_REST_HOST_NAME: rest-proxy
      KAFKA_REST_BOOTSTRAP_SERVERS: 'broker:29092'
      KAFKA_REST_LISTENERS: "http://0.0.0.0:8082"
      KAFKA_REST_SCHEMA_REGISTRY_URL: 'http://schema-registry:8081'

  # Web console for topics, messages, consumer groups, Schema Registry, Connect and ksqlDB.
  # kafbat/kafka-ui is the maintained fork of provectuslabs/kafka-ui. Port 8080 because REST Proxy has 8082.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.1
    hostname: kafka-ui
    container_name: kafka-ui
    depends_on:
      - broker
      - schema-registry
      - connect
      - ksqldb-server
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: broker:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      KAFKA_CLUSTERS_0_KSQLDBSERVER: http://ksqldb-server:8088

  # One-shot: creates sensor-data once the broker answers. The Flink Kafka source fails if the topic is missing.
  kafka-init:
    image: confluentinc/cp-server:8.4.1
    container_name: kafka-init
    depends_on:
      - broker
    entrypoint: ["bash", "-c"]
    command:
      - |
        for i in $$(seq 60); do
          kafka-topics --bootstrap-server broker:29092 --create --if-not-exists \
            --topic sensor-data --partitions 1 --replication-factor 1 && exit 0
          echo "Waiting for broker..."; sleep 2
        done
        exit 1
    restart: "no"

  # Nothing is bind-mounted: SQL files and scripts are baked into the Flink image (rebuild after edits).
  flink-jobmanager:
    build: *flink-build
    image: flink-dedup:2.2.1
    hostname: flink-jobmanager
    container_name: flink-jobmanager
    ports:
      - 9081:9081
    command: jobmanager
    environment: *flink-env
    # Healthy once the REST API answers and at least one TaskManager has registered
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9081/overview | grep -q '\"taskmanagers\":[1-9]'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  flink-taskmanager:
    build: *flink-build
    image: flink-dedup:2.2.1
    hostname: flink-taskmanager
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    scale: 1
    environment: *flink-env

  # Idle SQL client container for `just sql` (docker exec). The entrypoint writes FLINK_PROPERTIES first.
  flink-sql-client:
    build: *flink-build
    image: flink-dedup:2.2.1
    hostname: flink-sql-client
    container_name: flink-sql-client
    depends_on:
      - flink-jobmanager
    command: ["sleep", "infinity"]
    environment: *flink-env

  # One-shot: submits the dedup job once Flink and Postgres are ready and the topic exists (skips it if already running).
  # Uses `command`, not `entrypoint`, so the image entrypoint still applies FLINK_PROPERTIES.
  flink-job-submit:
    build: *flink-build
    image: flink-dedup:2.2.1
    container_name: flink-job-submit
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    command: ["/opt/scripts/submit-job.sh"]
    environment: *flink-env
    restart: "no"

  # Sensor data producer. Not started by `up`: run it with `just produce` (compose run --rm producer)
  producer:
    build: data-generator
    image: flink-dedup-producer:latest
    container_name: flink-dedup-producer
    profiles: [producer]
    depends_on:
      - broker
    environment:
      BOOTSTRAP_SERVERS: broker:29092
      RATE: ${RATE:-0}
      DURATION: ${DURATION:-0}

  # PostgreSQL as target database (postgres/Dockerfile bakes in init.sql)
  postgres:
    build: postgres
    image: flink-dedup-postgres:19
    container_name: postgres
    environment:
      POSTGRES_DB: flink_demo
      POSTGRES_USER: flink_user
      POSTGRES_PASSWORD: flink_pass
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18+ images keep data in a versioned subdirectory (/var/lib/postgresql/19/docker),
      # so the volume is mounted one level up. Not compatible with a pre-18 volume: `just clean` first.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U flink_user -d flink_demo"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
